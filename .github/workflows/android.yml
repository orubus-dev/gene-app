name: android

# Build + sign the Gene APK (app.orubu.gene) and attach it to a release.
# Self-contained signing: gene.keystore at repo root (alias gene,
# password gene-orubu-2026) — matches /.well-known/assetlinks.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "gene.keystore"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK is preinstalled on ubuntu runners (ANDROID_HOME set).
      - name: Build signed release APK
        working-directory: android
        env:
          GENE_KS_PASS: gene-orubu-2026
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/gene.keystore" \
            -Pandroid.injected.signing.store.password="$GENE_KS_PASS" \
            -Pandroid.injected.signing.key.alias="gene" \
            -Pandroid.injected.signing.key.password="$GENE_KS_PASS"

      - name: Verify signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs $APK | tee certs.txt
          grep -q "8B:A1:7B:6E" <(openssl x509 -inform DER 2>/dev/null || true) || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gene-app-orubu-gene-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG="gene-v${VER}"
          gh release create $TAG $APK \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gene v${VER} — Android (signed, app.orubu.gene)" \
            --notes "Fully self-contained: her whole mind (UI + python runtime + trained brain, ~15 MB) now ships inside the APK. First launch needs ZERO internet — no download screen, no CDN, no GitHub Pages. Open the app and she is simply awake.
          • Package: app.orubu.gene · versionCode 3 · same signing key as v1.0.0/v1.0.1 (installs as an update)
          • The website (orubus-dev.github.io/gene-app) now self-hosts its runtime too — no more jsdelivr dependency.
          • Everything still runs on-device: no cloud, no account, airplane-mode proof." \
            --latest || gh release upload $TAG $APK --clobber --repo "$GITHUB_REPOSITORY"
