name: Build Gene Android app (signed APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'twa/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android.keystore

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -Pandroid.injected.signing.store.file="$PWD/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs $APK

      - uses: actions/upload-artifact@v4
        with:
          name: gene-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          TAG=gene-v1.0
          gh release create $TAG $APK \
            --title "Gene v1.0 — Android app (signed APK)" \
            --notes "Install: download the APK, open it, allow install-from-browser. Package: app.orubu.gene. Open the app, tap Download Gene (~0.6 MB), chat — she runs fully on-device." \
            --latest || gh release upload $TAG $APK --clobber
