name: android

# Build + sign the Gene APK (app.orubu.gene) and attach it to a release.
# Signing key: gene.keystore at repo root (alias: gene, pass: gene-orubu-2026).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "gene.keystore"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon
        env:
          GENE_KS_PASS: gene-orubu-2026

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | tee certs.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gene-app-orubu-gene
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gene-v1.0.0
          name: Gene v1.0.0 — app.orubu.gene
          body: |
            Gene — an artificial organism on your phone.
            - Package: `app.orubu.gene`
            - Signed release APK. Install: download, open, allow install from this source.
            - After install: open Gene → Download Gene (~0.6 MB) → chat. Works offline forever after.
          files: android/app/build/outputs/apk/release/app-release.apk
